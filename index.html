    <!-- Boshlang'ich ekran: bundle yuklanguncha darhol ko'rinadi (JS'siz).
         «Atom laboratoriyasi» tilida: katak-qog'oz fon, orbitalar chiziladi
         va aylanadi, yadro «tushadi», nom harf-harf ko'tariladi, pastda esa
         jonli mashg'ulotlarning element kataklari birin-ketin chiqadi (u
         progres vazifasini ham bajaradi). Ranglar `themes.ts` dagi
         LAB_SHELL / LAB_DARK bilan bir xil, rejim `atomjs.mode` dan (pastdagi
         skript). Shriftlar ataylab tizimniki — bundle shrifti kelganda

    <style>
      #splash {
        --s-bg: #eef2f6;
        --s-fg: #14213d;
        --s-muted: #52607a;
        --s-paper: #ffffff;
        --s-line: #14213d;
        --s-ink: #14213d;
        --s-accent: #a23e21;
        --s-ok: #166e40;
        --s-warn: #855600;
        --s-err: #ae3232;
        --s-info: #275cb8;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        background-color: var(--s-bg);
        background-image:
          linear-gradient(
            color-mix(in srgb, var(--s-fg) 10%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--s-fg) 10%, transparent) 1px,
            transparent 1px
          );
        background-size: 28px 28px;
        background-position: center;
        color: var(--s-fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.is-off {
        opacity: 0;
        pointer-events: none;
      }
      /* Sessiyada bir marta ko'rsatiladi — bayroqni `<head>` dagi skript
         qo'yadi, ya'ni ilk bo'yashdan oldin (miltillash bo'lmaydi). */
      html.no-splash #splash {
        display: none;
      }

      .splash-stage {
        display: grid;
        justify-items: center;
        gap: 22px;
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash.is-off .splash-stage {
        transform: translateY(-14px);
      }

      /* ── Atom: orbitalar avval CHIZILADI, keyin aylanadi ─────────── */
      .splash-atom {
        width: 148px;
        height: 148px;
        overflow: visible;
      }
      .splash-atom .orb {
        transform-box: view-box;
        transform-origin: 100px 100px;
        animation: s-spin var(--d) linear infinite;
      }
      .splash-atom ellipse {
        fill: none;
        stroke: var(--s-fg);
        stroke-opacity: 0.3;
        stroke-width: 2.5;
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: s-draw 0.8s cubic-bezier(0.6, 0, 0.2, 1) forwards;
        animation-delay: var(--w);
      }
      .splash-atom .orb-a ellipse {
        stroke: var(--s-accent);
        stroke-opacity: 1;
        stroke-width: 3.5;
      }
      .splash-atom .e {
        fill: var(--s-accent);
        opacity: 0;
        animation: s-fade 0.3s ease forwards;
        animation-delay: 0.9s;
      }
      /* Yadro — logotipdagi kesik burchakli kvadrat */
      .splash-atom .core {
        fill: var(--s-accent);
        stroke: var(--s-line);
        stroke-width: 3;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0);
        animation: s-core 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        animation-delay: 0.35s;
      }

      /* ── Nom ──────────────────────────────────────────────────────── */
      .splash-name {
        display: flex;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .splash-name .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.45em);
        animation: s-rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        animation-delay: calc(0.55s + var(--i) * 0.05s);
      }
      .splash-name .js {
        color: var(--s-accent);
      }

      /* ── Element kataklari: progres ham shu ──────────────────────── */
      .splash-cells {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .splash-cells .cell {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 46px;
        border: 2px solid var(--s-line);
        border-radius: 6px;
        background: color-mix(in srgb, var(--t) 16%, var(--s-paper));
        box-shadow: 3px 3px 0 var(--s-ink);
        color: var(--t);
        font-size: 17px;
        font-weight: 800;
        opacity: 0;
        transform: translateY(10px) scale(0.85);
        animation:
          s-cell 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
          s-bob 2.4s ease-in-out infinite;
        animation-delay:
          calc(0.9s + var(--i) * 0.11s),
          calc(1.8s + var(--i) * 0.2s);
      }
      .splash-cells .cell b {
        position: absolute;
        top: 3px;
        left: 5px;
        font:
          600 9px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--s-fg);
      }

      @keyframes s-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes s-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes s-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes s-core {
        to {
          transform: scale(1);
        }
      }
      @keyframes s-rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes s-cell {
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Ilova sekin yuklansa ham ekran «tirik» qolsin: kataklar navbatma-
         navbat bir oz ko'tariladi. `translate` — `transform` bilan
         to'qnashmaydi (kirish animatsiyasi o'shani ishlatadi). */
      @keyframes s-bob {
        0%,
        70%,
        100% {
          translate: 0 0;
        }
        35% {
          translate: 0 -5px;
        }
      }

      /* Imzo — ekran pastida, sahnadan keyin ohista chiqadi. */
      #splash .splash-sig {
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(22px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font: 500 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI",

        color: var(--s-muted);
        letter-spacing: 0.02em;
        text-align: center;
        opacity: 0;
        animation: splash-sig-in 0.6s 0.9s ease-out forwards;
      }
      #splash .splash-sig b {
        font-weight: 700;
        font-size: 13px;
        color: var(--s-fg, currentColor);
      }
      @keyframes splash-sig-in {
        to {
          opacity: 1;
        }
      }

      /* Harakatga sezgir foydalanuvchilar uchun — statik ko'rinish */
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash .splash-stage {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        .splash-atom ellipse {
          stroke-dashoffset: 0;
        }
      }
    </style>

    <script>
      // Splash faqat sessiyada birinchi ochilishda. Bu skript `<head>` da,
      // ya'ni splash bo'yalguncha ishlaydi — "miltillash" bo'lmaydi.
      // `?nosplash` bilan ham o'tkazib yuborsa bo'ladi (splash.ts).
      try {
        if (sessionStorage.getItem("atomjs.splashed") === "1") {
          window.__splashSkip = true;
          document.documentElement.classList.add("no-splash");
        } else {
          sessionStorage.setItem("atomjs.splashed", "1");
        }
      } catch (e) {}
    </script>
